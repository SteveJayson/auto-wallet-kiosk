<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Merchant Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #111827; color: white; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;}
        .dashboard { background: #1F2937; padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); position: relative; }
        
        .queue-card { background: #374151; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid #10B981; display: flex; justify-content: space-between; align-items: center; }
        .queue-info h3 { margin: 0 0 5px 0; font-size: 20px; }
        .queue-info p { margin: 0; color: #9CA3AF; font-size: 14px; }
        
        input[type="text"].greeting-input { width: 100%; padding: 15px; font-size: 16px; border-radius: 8px; border: none; background: #374151; color: white; margin-top: 15px; box-sizing: border-box;}
        
        .file-upload-wrapper { margin-top: 20px; margin-bottom: 15px; text-align: left; }
        .file-upload-label { display: block; background: #374151; padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; cursor: pointer; color: #9CA3AF; border: 1px dashed #6B7280; }
        .file-upload-label:hover { background: #4B5563; color: white; }
        input[type="file"] { display: none; }
        
        button { padding: 10px 15px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; color: white; transition: 0.1s;}
        button:active { transform: scale(0.98); }
        .btn-green { background: #10B981; }
        .btn-blue { background: #3B82F6; width: 100%; padding: 15px; font-size: 16px; margin-top: 15px;}
        .btn-cancel { background: transparent; color: #9CA3AF; border: 1px solid #6B7280; width: 100%; padding: 15px; margin-top: 10px; }
        
        .micro-copy-btn { background: #111827; color: #9CA3AF; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; width: auto; margin-left: 10px; display: inline-flex; align-items: center; justify-content: center;}
        .micro-copy-btn:hover { background: #4B5563; color: white; }

        #actionScreen { display: none; }
    </style>
</head>
<body>

<!-- Queue View -->
<div class="dashboard" id="queueScreen">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin:0;">Live Queue</h2>
        <span id="queueCount" style="background: #10B981; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold;">0</span>
    </div>
    
    <div id="queueList">
        <p style="text-align: center; color: #9CA3AF;">No pending requests.</p>
    </div>
</div>

<!-- Action View -->
<div class="dashboard" id="actionScreen">
    <h3 style="margin-top:0; color:#10B981;">Process Cash-In</h3>
    <div style="background: #111827; padding: 15px; border-radius: 8px; border: 1px solid #374151; margin-bottom: 15px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px; align-items:center;">
            <span style="color:#9CA3AF;">Mobile:</span> 
            <div style="display:flex; align-items:center;">
                <strong id="activeMobile" style="font-size: 18px;"></strong>
                <button class="micro-copy-btn" id="copyBtn">📋</button>
            </div>
        </div>
        <div style="display:flex; justify-content:space-between;">
            <span style="color:#9CA3AF;">Amount:</span> <strong id="activeAmount" style="font-size: 18px; color: #10B981;"></strong>
        </div>
    </div>
    
    <div class="file-upload-wrapper">
        <label for="receiptImage" class="file-upload-label" id="fileLabel">
            📸 Attach GCash Screenshot (Optional)
        </label>
        <input type="file" id="receiptImage" accept="image/*" onchange="updateFileName()">
    </div>
    
    <input type="text" id="greetingMsg" class="greeting-input" placeholder="Type a greeting (Optional)">
    
    <button class="btn-blue" onclick="sendToCustomer()">COMPLETE & SEND TO CUSTOMER</button>
    <button class="btn-cancel" onclick="backToQueue()">Cancel</button>
    
    <div id="sendStatus" style="margin-top:15px; font-weight:bold; text-align:center; color:#10B981;"></div>
</div>

<script>
    let currentRefId = ""; 
    let queueLength = 0;

    // Fetch the live queue from the server
    async function fetchQueue() {
        if(document.getElementById('actionScreen').style.display === 'block') return; // Don't refresh while processing
        
        try {
            const res = await fetch('/api/merchant/queue');
            const queue = await res.json();
            
            document.getElementById('queueCount').innerText = queue.length;
            const queueList = document.getElementById('queueList');
            
            if(queue.length === 0) {
                queueList.innerHTML = '<p style="text-align: center; color: #9CA3AF;">No pending requests.</p>';
            } else {
                queueList.innerHTML = '';
                queue.forEach(tx => {
                    queueList.innerHTML += `
                        <div class="queue-card">
                            <div class="queue-info">
                                <h3>₱${tx.amount.toFixed(2)}</h3>
                                <p>${tx.mobile} | ${tx.date.split(',')[1]}</p>
                            </div>
                            <button class="btn-green" onclick="openActionScreen('${tx.reference_id}', '${tx.mobile}', ${tx.amount})">PROCESS</button>
                        </div>
                    `;
                });
            }
        } catch (error) {
            console.error("Failed to fetch queue.");
        }
    }

    function openActionScreen(refId, mobile, amount) {
        currentRefId = refId;
        document.getElementById('activeMobile').innerText = mobile;
        document.getElementById('activeAmount').innerText = `₱${amount.toFixed(2)}`;
        
        // Setup copy button
        const copyBtn = document.getElementById('copyBtn');
        copyBtn.onclick = () => {
            navigator.clipboard.writeText(mobile).then(() => {
                copyBtn.innerText = "✅";
                setTimeout(() => copyBtn.innerText = "📋", 2000);
            });
        };

        document.getElementById('queueScreen').style.display = 'none';
        document.getElementById('actionScreen').style.display = 'block';
    }

    function backToQueue() {
        document.getElementById('actionScreen').style.display = 'none';
        document.getElementById('queueScreen').style.display = 'block';
        resetForm();
    }

    function updateFileName() {
        const fileInput = document.getElementById('receiptImage');
        const label = document.getElementById('fileLabel');
        if (fileInput.files.length > 0) {
            label.innerHTML = `✅ Attached: ${fileInput.files[0].name}`;
            label.style.borderColor = "#10B981";
            label.style.color = "#10B981";
        }
    }

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    async function sendToCustomer() {
        const greeting = document.getElementById('greetingMsg').value.trim();
        const fileInput = document.getElementById('receiptImage');
        const statusEl = document.getElementById('sendStatus');
        
        statusEl.innerText = "Sending...";
        statusEl.style.color = "#10B981";

        let base64String = null;
        if (fileInput.files.length > 0) {
            base64String = await fileToBase64(fileInput.files[0]);
        }

        try {
            const res = await fetch('/merchant/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    pin: "1234", 
                    reference_id: currentRefId, 
                    greeting: greeting,
                    receipt_image: base64String 
                }) 
            });

            if (res.ok) {
                statusEl.innerText = "✅ Transaction Complete!";
                setTimeout(() => {
                    backToQueue();
                    fetchQueue();
                }, 1500);
            }
        } catch (error) {
            statusEl.innerText = "Failed to send.";
            statusEl.style.color = "#EF4444";
        }
    }

    function resetForm() {
        document.getElementById('greetingMsg').value = "";
        document.getElementById('receiptImage').value = ""; 
        document.getElementById('fileLabel').innerHTML = "📸 Attach GCash Screenshot (Optional)";
        document.getElementById('fileLabel').style.borderColor = "#6B7280";
        document.getElementById('fileLabel').style.color = "#9CA3AF";
        document.getElementById('sendStatus').innerText = "";
    }

    // Auto-refresh queue every 3 seconds
    setInterval(fetchQueue, 3000);
    fetchQueue();
</script>
</body>
</html>
