<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #111827; color: white; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;}
        .dashboard { background: #1F2937; padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); position: relative; }
        
        .tab-container { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid #374151; padding-bottom: 10px; align-items: center;}
        .tab-btn { background: transparent; color: #9CA3AF; border: none; font-size: 16px; font-weight: bold; cursor: pointer; padding: 5px 10px; transition: 0.2s;}
        .tab-btn.active { color: #10B981; border-bottom: 2px solid #10B981; }
        
        .btn-alert { background: #10B981; color: white; border: none; font-size: 12px; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-left: auto; font-weight: bold;}

        #alarmBanner { display: none; background: #EF4444; padding: 20px; text-align: center; margin-bottom: 20px; border-radius: 8px; animation: pulseRed 1s infinite alternate; }
        @keyframes pulseRed { from { background: #EF4444; } to { background: #DC2626; } }
        .btn-stop-alarm { background: white; color: #EF4444; width: 100%; padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }

        .queue-card { background: #374151; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid #10B981; display: flex; justify-content: space-between; align-items: center; }
        .queue-info h3 { margin: 0 0 5px 0; font-size: 20px; }
        .queue-info p { margin: 0; color: #9CA3AF; font-size: 14px; }
        
        .history-card { border-left: 5px solid #4B5563; opacity: 0.8; }
        .btn-trash { background: #EF4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
        .btn-clear-all { background: transparent; color: #EF4444; border: 1px solid #EF4444; width: 100%; padding: 10px; border-radius: 8px; margin-bottom: 15px; cursor: pointer; font-weight: bold; }

        input[type="text"].greeting-input { width: 100%; padding: 15px; font-size: 16px; border-radius: 8px; border: none; background: #374151; color: white; margin-top: 15px; box-sizing: border-box;}
        .file-upload-wrapper { margin-top: 20px; margin-bottom: 15px; text-align: left; }
        .file-upload-label { display: block; background: #374151; padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; cursor: pointer; color: #9CA3AF; border: 1px dashed #6B7280; }
        input[type="file"] { display: none; }
        
        button { padding: 10px 15px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; color: white; }
        .btn-green { background: #10B981; }
        .btn-blue { background: #3B82F6; width: 100%; padding: 15px; font-size: 16px; margin-top: 15px;}
        .btn-cancel { background: transparent; color: #9CA3AF; border: 1px solid #6B7280; width: 100%; padding: 15px; margin-top: 10px; }

        #actionScreen, #historyScreen { display: none; }
    </style>
</head>
<body>

<div class="dashboard" id="mainDashboard">
    <div class="tab-container">
        <button class="tab-btn active" id="tabQueue" onclick="switchTab('queue')">Queue <span id="queueCount" style="background: #10B981; padding: 2px 6px; border-radius: 10px; font-size: 10px;">0</span></button>
        <button class="tab-btn" id="tabHistory" onclick="switchTab('history')">History</button>
        <button class="btn-alert" onclick="activateApp()">🔊 Active Audio</button>
    </div>

    <div id="alarmBanner">
        <h3 style="margin: 0; color: white; font-size: 22px;">🚨 NEW REQUEST WAITING 🚨</h3>
        <p style="margin: 5px 0 0 0; color: #FCA5A5;">A customer is waiting at the kiosk!</p>
        <button class="btn-stop-alarm" onclick="stopAlarm()">🔕 STOP ALARM</button>
    </div>

    <div id="queueScreen">
        <div id="queueList"><p style="text-align: center; color: #9CA3AF;">No pending requests.</p></div>
    </div>

    <div id="historyScreen">
        <button class="btn-clear-all" id="clearAllBtn" onclick="clearAllHistory()" style="display: none;">🗑️ Clear All History</button>
        <div id="historyList"><p style="text-align: center; color: #9CA3AF;">No completed transactions yet.</p></div>
    </div>
</div>

<div class="dashboard" id="actionScreen">
    <h3 style="margin-top:0; color:#10B981;">Process Cash-In</h3>
    <div style="background: #111827; padding: 15px; border-radius: 8px; border: 1px solid #374151; margin-bottom: 15px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
            <span style="color:#9CA3AF;">Mobile:</span> <strong id="activeMobile" style="font-size: 18px;"></strong>
        </div>
        <div style="display:flex; justify-content:space-between;">
            <span style="color:#9CA3AF;">Amount:</span> <strong id="activeAmount" style="font-size: 18px; color: #10B981;"></strong>
        </div>
    </div>
    
    <div class="file-upload-wrapper">
        <label for="receiptImage" class="file-upload-label" id="fileLabel">📸 Attach GCash Screenshot (Optional)</label>
        <input type="file" id="receiptImage" accept="image/*" onchange="updateFileName()">
    </div>
    
    <input type="text" id="greetingMsg" class="greeting-input" placeholder="Type a greeting (Optional)">
    <button class="btn-blue" onclick="sendToCustomer()">COMPLETE & SEND TO CUSTOMER</button>
    <button class="btn-cancel" onclick="backToQueue()">Cancel</button>
    <div id="sendStatus" style="margin-top:15px; font-weight:bold; text-align:center; color:#10B981;"></div>
</div>

<script>
    let currentRefId = ""; 
    let currentTab = 'queue';
    let lastCount = 0;
    let audioCtx = null;
    let alarmInterval = null;

    function activateApp() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        playBeep(0.01);
        alert("Audio engine activated successfully!");
        fetchQueue();
    }

    function playBeep(volume = 0.2) {
        if (!audioCtx) return;
        try {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } catch (e) {}
    }

    function triggerAlarm() {
        if (alarmInterval !== null) return;
        document.getElementById('alarmBanner').style.display = 'block';
        playBeep(0.2);
        if (navigator.vibrate) navigator.vibrate([1000, 500, 1000]);
        alarmInterval = setInterval(() => {
            playBeep(0.2);
            if (navigator.vibrate) navigator.vibrate([1000, 500, 1000]);
        }, 1500);
    }

    function stopAlarm() {
        if (alarmInterval !== null) {
            clearInterval(alarmInterval);
            alarmInterval = null;
        }
        if (navigator.vibrate) navigator.vibrate(0);
        document.getElementById('alarmBanner').style.display = 'none';
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tabQueue').classList.toggle('active', tab === 'queue');
        document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
        document.getElementById('queueScreen').style.display = tab === 'queue' ? 'block' : 'none';
        document.getElementById('historyScreen').style.display = tab === 'history' ? 'block' : 'none';
        if (tab === 'queue') fetchQueue();
        if (tab === 'history') fetchHistory();
    }

    async function fetchQueue() {
        if (document.getElementById('actionScreen').style.display === 'block' || currentTab !== 'queue') return;
        try {
            const res = await fetch('/api/merchant/queue');
            const queue = await res.json();
            document.getElementById('queueCount').innerText = queue.length;
            const queueList = document.getElementById('queueList');
            
            if (queue.length === 0) {
                queueList.innerHTML = '<p style="text-align: center; color: #9CA3AF;">No pending requests.</p>';
            } else {
                queueList.innerHTML = '';
                queue.forEach(tx => {
                    queueList.innerHTML += `
                        <div class="queue-card">
                            <div class="queue-info">
                                <h3>₱${tx.amount.toFixed(2)}</h3>
                                <p>${tx.mobile} | ${tx.date.split(',')[1]}</p>
                            </div>
                            <button class="btn-green" onclick="openActionScreen('${tx.reference_id}', '${tx.mobile}', ${tx.amount})">PROCESS</button>
                        </div>
                    `;
                });
            }

            if (queue.length > lastCount) {
                triggerAlarm();
            }
            lastCount = queue.length;
        } catch (e) {}
    }

    async function fetchHistory() {
        try {
            const res = await fetch('/api/merchant/history');
            const history = await res.json();
            const historyList = document.getElementById('historyList');
            const clearBtn = document.getElementById('clearAllBtn');
            
            if (history.length === 0) {
                historyList.innerHTML = '<p style="text-align: center; color: #9CA3AF;">No completed transactions yet.</p>';
                clearBtn.style.display = 'none';
            } else {
                clearBtn.style.display = 'block';
                historyList.innerHTML = '';
                history.forEach(tx => {
                    historyList.innerHTML += `
                        <div class="queue-card history-card">
                            <div class="queue-info">
                                <h3>₱${tx.amount.toFixed(2)} <span style="font-size:12px; color:#10B981;">(${tx.type})</span></h3>
                                <p>${tx.mobile} | ${tx.date}</p>
                            </div>
                            <button class="btn-trash" onclick="deleteHistory('${tx.reference_id}')">🗑️</button>
                        </div>
                    `;
                });
            }
        } catch (e) {}
    }

    async function deleteHistory(refId) {
        if (!confirm("Delete transaction?")) return;
        await fetch(`/api/merchant/history/${refId}`, { method: 'DELETE' });
        fetchHistory();
    }

    async function clearAllHistory() {
        if (!confirm("Wipe all history?")) return;
        await fetch(`/api/merchant/history`, { method: 'DELETE' });
        fetchHistory();
    }

    function openActionScreen(refId, mobile, amount) {
        stopAlarm();
        currentRefId = refId;
        document.getElementById('activeMobile').innerText = mobile;
        document.getElementById('activeAmount').innerText = `₱${amount.toFixed(2)}`;
        document.getElementById('mainDashboard').style.display = 'none';
        document.getElementById('actionScreen').style.display = 'block';
    }

    function backToQueue() {
        document.getElementById('actionScreen').style.display = 'none';
        document.getElementById('mainDashboard').style.display = 'block';
        document.getElementById('greetingMsg').value = "";
        document.getElementById('receiptImage').value = "";
        document.getElementById('sendStatus').innerText = "";
    }

    function updateFileName() {
        const file = document.getElementById('receiptImage').files[0];
        if (file) document.getElementById('fileLabel').innerText = `✅ Attached: ${file.name}`;
    }

    async function sendToCustomer() {
        const greeting = document.getElementById('greetingMsg').value.trim();
        const file = document.getElementById('receiptImage').files[0];
        const status = document.getElementById('sendStatus');
        status.innerText = "Sending...";

        let base64 = null;
        if (file) {
            base64 = await new Promise(res => {
                const r = new FileReader();
                r.onload = () => res(r.result);
                r.readAsDataURL(file);
            });
        }

        const res = await fetch('/merchant/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin: "1234", reference_id: currentRefId, greeting, receipt_image: base64 })
        });

        if (res.ok) {
            status.innerText = "✅ Sent!";
            setTimeout(() => { backToQueue(); fetchQueue(); }, 1500);
        } else {
            status.innerText = "Failed to send.";
        }
    }

    // Real-time EventSource Stream listener
    const evt = new EventSource('/api/merchant/stream');
    evt.onmessage = (e) => { if (e.data === "trigger") fetchQueue(); };

    setInterval(fetchQueue, 800); // Safety backup poll
    fetchQueue();
</script>
</body>
</html>
